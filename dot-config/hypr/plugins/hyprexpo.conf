bind = SUPER SHIFT, Space, hyprexpo:expo, toggle
bind = SUPER SHIFT, G, hyprexpo:expo, select

plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = center current # [center/first] [workspace] e.g. first 1 or center m+1
        skip_empty = true
    }
}
