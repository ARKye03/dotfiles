# stay_focused rules
windowrule {
  name = polkit-stay_focused
  match:class = polkit-gnome-authentication-agent-1
  stay_focused = true
}

windowrule {
  name = firefox-cookies-stay_focused
  match:class = firefox
  match:title = Removing Cookies and Site Data
  stay_focused = true
}

windowrule {
  name = bleachbit-stay_focused
  match:class = org.bleachbit.BleachBit
  match:title = Delete confirmation
  stay_focused = true
}

windowrule {
  name = zed-settings-stay_focused
  match:class = dev.zed.Zed
  match:title = Zed — Settings
  stay_focused = true
}

windowrule {
  name = portal-stay_focused
  match:class = xdg-desktop-portal-gtk
  stay_focused = true
}

# Brave
#--------2
windowrule {
  name = brave-workspace
  match:class = ^(.*[Bb]rave-browser.*)$
  workspace = 2
}

# ----Brave_PIP
windowrule {
  name = brave-pip
  match:title = (Picture in picture)
  float = true
  size = 600 350
  move = 1310 720
  pin = true
}

#----Brave_Save_File
windowrule {
  name = brave-save-file
  match:class = (brave)
  match:title = (Save File)
  float = true
  size = 715 570
  move = 710 160
}

