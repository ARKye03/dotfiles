# Brave
#--------2
windowrule = workspace 2, ^(.*[Bb]rave-browser.*)$
# ----Brave_PIP
windowrulev2 = float,title:(Picture in picture)
windowrulev2 = size 600 350,title:(Picture in picture)
windowrulev2 = move 1310 720,title:(Picture in picture)
windowrulev2 = pin,title:(Picture in picture)
#----Brave_Save_File
windowrulev2 = float,class:(brave),title:(Save File)
windowrulev2 = size 715 570,class:(brave),title:(Save File)
windowrulev2 = move 710 160,class:(brave),title:(Save File)

# Code and Zed
#--------3
windowrule = workspace 3, ^(code.*)$
windowrule = workspace 3, ^(.*dev.zed.Zed.*)$

#--------4
windowrule = workspace 4, ^(.*[Nn]autilus.*)$
# Thunar
windowrule = workspace 4, ^(.*[Tt]hunar.*)$
windowrulev2= size 400 150,class:([Tt]hunar),title:(Create New Folder)
windowrulev2= move 485 350,class:([Tt]hunar),title:(Create New Folder)
windowrulev2 = float,class:(Player),title:(Player)

#--------5
windowrule = workspace 6, ^([Dd]iscord)$

#--------7
windowrulev2 = workspace 7, title:^(SoundCloud.*)$

#--------8
windowrule = workspace 8, ^(.*uget-gtk.*)$
windowrule = workspace 8, ^(.*bleachbit.*)$

# Waydroid and Steam
#--------9
windowrule = workspace 9, ^(.*[Ss]team.*)$
windowrule = workspace 9, ^(faugus-.*)$

#--------10

# Warp
windowrule=tile,^(dev.warp.Warp)$
windowrule=noblur,^(dev.warp.Warp)$

# Floatcritty
windowrule=float,^(floatcritty)$
windowrule=size 900 600,^(floatcritty)$
windowrule=move 510 50,^(floatcritty)$
windowrule=pin,^(floatcritty)$
windowrule=animation slide,^(floatcritty)$

# Engrampa
windowrule=float,^(engrampa)$

# Kitty
windowrule=noblur,^(kitty)$
windowrule=float,^(kitty)
windowrule=size 900 520,^(kitty)
windowrule=move 230 160,^(kitty)

# MSEdge
#---BingGPT
windowrulev2 = size 606 1007 ,class:(Microsoft-edge),title:(BingGPT)
windowrulev2 = move 1314 52,class:(Microsoft-edge),title:(BingGPT)
windowrulev2 = animation slide,class:(Microsoft-edge),title:(BingGPT)

# ProtonVPN
windowrule = pin, ^(protonvpn-app)
windowrule = size 400 600, ^(protonvpn-app)
windowrule = move 10 420, ^(protonvpn-app)

#---WhatsApp
windowrulev2 = workspace 6, title:^(WhatsApp Web)$
windowrulev2 = tile, title:^(WhatsApp Web)$


# NoBlur
windowrule=noblur,^(vlc)$
windowrule=noblur,^(.*[Bb]rave-browser.*)$
