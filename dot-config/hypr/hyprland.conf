monitor=, 1920x1080, 0x0, 1

input {
    kb_layout = us,us
    kb_variant = ,intl 
    kb_model = 
    kb_options =
    kb_rules =
    numlock_by_default = true

    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(8839efff)
    col.inactive_border = rgba(595959aa)
    allow_tearing = true

    layout = master
}

misc {
    disable_splash_rendering = true
    disable_hyprland_logo = true
}

decoration {
    rounding = 0

    blur {
        enabled = false
        new_optimizations = true
        size = 5
        passes = 4
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    bezier = easeInOutExpo, 0.87, 0, 0.13, 1
    bezier = easeInOutBack, 0.68, -0.6, 0.32, 1.6

    animation = windows, 1, 3, default, gnomed
    animation = windowsOut, 1, 3, default, gnomed
    animation = layers, 1, 3, easeInOutCubic
    animation = layersOut, 1, 3, easeInOutCubic
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 3, easeInOutCubic
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

cursor {
    no_hardware_cursors = true
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

windowrulev2 = immediate, class:^(steam_app_0)$

# Load plugins 
# source = ~/.config/hypr/plugins/hyprexpo.conf
# exec-once = hyprpm reload -n

#Autostart
source = ~/.config/hypr/default/startup.conf

#Cursor
# source = ~/.config/hypr/default/cursor.conf

#KeyBinds
source = ~/.config/hypr/default/binds.conf

#WholeWorldHere
source = ~/.config/hypr/default/windowrules.conf

#Plugins
source = ~/.config/hypr/morghulis.conf
